name: Deploy WebRPG site

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: Frontend commit to build (rollback only; defaults to workflow commit)
        required: false
        type: string
      index_ref:
        description: WebRPG-org/index immutable 40-character commit SHA (optional)
        required: false
        type: string
  repository_dispatch:
    types: [index-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected frontend revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.frontend_ref || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Validate snapshot, full catalog, HTML/SEO and legacy route reservation
        env:
          INDEX_REF: ${{ inputs.index_ref || github.event.client_payload.index_ref || '' }}
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run ci
      - name: Install Chrome for real browser checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
      - name: Run desktop, mobile, no-JavaScript and language recommendation checks
        env:
          BROWSER_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:browser
      - name: Upload build manifest
        uses: actions/upload-artifact@v4
        with:
          name: webrpg-build-manifest
          path: dist/build-manifest.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
